<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Site detail — Uptime Watch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-white border-bottom sticky-top">
  <div class="container-xl py-1">
    <a href="/" class="btn btn-sm btn-outline-secondary me-3" title="Back to dashboard">←</a>
    <div class="min-w-0">
      <span class="navbar-brand fw-bold mb-0 text-truncate d-block" id="siteTitle">Loading…</span>
      <a id="siteUrlLink" href="#" target="_blank" rel="noopener" class="small text-muted text-truncate d-block"></a>
    </div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="status-badge badge rounded-pill" id="siteStatusBadge"></span>
      <button id="checkNowBtn" class="btn btn-sm btn-outline-secondary">
        <span class="spinner-border spinner-border-sm d-none" id="checkNowSpinner"></span>
        Check now
      </button>
    </div>
  </div>
</nav>

<div class="container-xl py-4">

  <!-- Date range filter -->
  <div class="d-flex flex-wrap gap-2 align-items-center mb-3 filter-row">
    <div class="btn-group btn-group-sm" role="group" id="rangeGroup">
      <input type="radio" class="btn-check" name="range" id="range1" value="1" checked>
      <label class="btn btn-outline-secondary" for="range1">Today</label>
      <input type="radio" class="btn-check" name="range" id="range7" value="7">
      <label class="btn btn-outline-secondary" for="range7">7 days</label>
      <input type="radio" class="btn-check" name="range" id="range30" value="30">
      <label class="btn btn-outline-secondary" for="range30">30 days</label>
      <input type="radio" class="btn-check" name="range" id="rangeAll" value="all">
      <label class="btn btn-outline-secondary" for="rangeAll">All time</label>
      <input type="radio" class="btn-check" name="range" id="rangeCustom" value="custom">
      <label class="btn btn-outline-secondary" for="rangeCustom">Custom</label>
    </div>
    <div id="customRangeWrap" class="d-none d-flex gap-2 align-items-center">
      <input type="date" id="customFrom" class="form-control form-control-sm">
      <span class="text-muted small">to</span>
      <input type="date" id="customTo" class="form-control form-control-sm">
      <button id="applyCustomRange" class="btn btn-sm btn-primary">Apply</button>
    </div>
    <div class="btn-group btn-group-sm ms-auto" role="group" id="logStatusFilterGroup">
      <input type="radio" class="btn-check" name="logStatusFilter" id="logAll" value="all" checked>
      <label class="btn btn-outline-secondary" for="logAll">All checks</label>
      <input type="radio" class="btn-check" name="logStatusFilter" id="logUp" value="up">
      <label class="btn btn-outline-secondary" for="logUp">Up</label>
      <input type="radio" class="btn-check" name="logStatusFilter" id="logWarning" value="warning">
      <label class="btn btn-outline-secondary" for="logWarning">Warning</label>
      <input type="radio" class="btn-check" name="logStatusFilter" id="logDown" value="down">
      <label class="btn btn-outline-secondary" for="logDown">Down</label>
    </div>
  </div>

  <!-- Analytics for range -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Uptime (selected range)</div>
        <div class="stat-value" id="rangeUptime">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Avg response</div>
        <div class="stat-value" id="rangeAvgResponse">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Total checks</div>
        <div class="stat-value" id="rangeChecks">—</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-label">Incidents</div>
        <div class="stat-value stat-critical" id="rangeIncidents">—</div>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div class="card chart-card mb-4">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h3 class="section-title mb-0">Response time</h3>
        <div class="chart-legend small text-muted">
          <span class="legend-dot legend-up"></span> Up
          <span class="legend-dot legend-warning"></span> Warning
          <span class="legend-dot legend-down"></span> Down
        </div>
      </div>
      <div id="chartEmpty" class="text-muted small py-5 text-center d-none">No checks recorded in this range yet.</div>
      <div class="chart-canvas-wrap">
        <canvas id="responseChart"></canvas>
      </div>
    </div>
  </div>

  <!-- Daily summary -->
  <h3 class="section-title mb-3">Daily summary</h3>
  <div id="dailySummaryList" class="vstack gap-2 mb-4"></div>
  <div id="dailyEmpty" class="text-center text-muted py-4 d-none">No checks recorded in this range yet.</div>

  <footer class="text-center text-muted small mt-5 pt-3 border-top">
    Uptime Watch · self-hosted · Pash G, All Practice Solutions
  </footer>
</div>

<!-- Day summary template -->
<template id="daySummaryTemplate">
  <div class="card day-card">
    <button class="day-header btn text-start w-100 d-flex align-items-center gap-3" type="button" data-bs-toggle="collapse">
      <span class="day-date fw-semibold"></span>
      <span class="status-badge badge rounded-pill day-uptime-badge"></span>
      <span class="small text-muted day-meta ms-auto"></span>
      <span class="chevron">⌄</span>
    </button>
    <div class="collapse day-collapse">
      <div class="card-body pt-0">
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0 day-log-table">
            <thead>
              <tr class="small text-muted">
                <th>Time</th>
                <th>Status</th>
                <th>HTTP</th>
                <th>Response</th>
                <th>Detail</th>
              </tr>
            </thead>
            <tbody class="day-log-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/shared.js"></script>
<script src="/site.js"></script>
</body>
</html>
